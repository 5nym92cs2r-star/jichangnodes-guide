name: Sync published website directory

on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/sync.yml']
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write

concurrency:
  group: published-directory
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '5nym92cs2r-star/jichangnodes-guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read the published public directory
        run: node scripts/sync.mjs
      - name: Update public documentation when content changes
        run: |
          git add -- README.md DIRECTORY.md
          if git diff --cached --quiet; then
            echo 'Published content is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '同步已上线的网站内容'
          git push origin HEAD:main
